<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palash Patel | Software Engineer</title>
    <meta name="description" content="Creative developer specializing in fluid, engaging web experiences. Building interfaces that feel alive and responsive." />
    <meta name="author" content="Palash Patel" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Palash Patel | Software Engineer" />
    <meta property="og:description" content="Creative developer specializing in fluid, engaging web experiences." />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Applies the saved (or system) theme before first paint so the page never
      flashes the wrong background. Must stay in sync with src/hooks/use-theme.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
